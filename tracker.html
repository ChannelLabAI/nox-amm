<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOX 持倉追蹤器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --gold: #D4A842;
    --gold-light: #F0D68A;
    --gold-dark: #A67C2E;
    --green: #22C55E;
    --green-glow: rgba(34, 197, 94, 0.15);
    --red: #EF4444;
    --bg-dark: #0A0A0F;
    --bg-card: #12121A;
    --bg-input: #0E0E16;
    --text-primary: #EEEEF0;
    --text-secondary: #9999AA;
    --purple: #8B5CF6;
    --border: rgba(212, 168, 66, 0.15);
    --border-focus: rgba(212, 168, 66, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', -apple-system, sans-serif;
    background: var(--bg-dark);
    color: var(--text-primary);
    line-height: 1.7;
    overflow-x: hidden;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 50%, rgba(212, 168, 66, 0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 1;
  }

  .hero {
    text-align: center;
    padding: 60px 0 40px;
  }

  .hero-badge {
    display: inline-block;
    padding: 5px 16px;
    border: 1px solid var(--purple);
    border-radius: 50px;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--purple);
    text-transform: uppercase;
    margin-bottom: 20px;
    background: rgba(139, 92, 246, 0.1);
  }

  .hero h1 {
    font-size: clamp(24px, 4vw, 38px);
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-sub {
    font-size: 14px;
    color: var(--text-secondary);
  }

  /* Search bar */
  .search-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 32px;
  }

  .search-row {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .search-input {
    flex: 1;
    padding: 14px 20px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input:focus { border-color: var(--border-focus); }
  .search-input::placeholder { color: var(--text-secondary); font-size: 13px; }

  .search-btn {
    padding: 14px 28px;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    border: none;
    border-radius: 12px;
    color: #0A0A0F;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .search-btn:hover { opacity: 0.9; }
  .search-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Summary stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    text-align: center;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    font-weight: 700;
  }

  .stat-sub {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 3px;
  }

  /* Table */
  .table-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 40px;
    overflow-x: auto;
  }

  .table-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .table-header h2 { font-size: 18px; font-weight: 700; }

  .count-badge {
    padding: 4px 12px;
    background: rgba(139, 92, 246, 0.1);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 50px;
    font-size: 12px;
    color: var(--purple);
    font-family: 'JetBrains Mono', monospace;
  }

  .tx-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
  }

  .tx-table th {
    text-align: left;
    padding: 10px 14px;
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }

  .tx-table td {
    padding: 13px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    vertical-align: middle;
  }

  .tx-table tr:hover td { background: rgba(212, 168, 66, 0.03); }
  .tx-table tr:last-child td { border-bottom: none; }

  .badge-buy {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 4px;
    background: rgba(34, 197, 94, 0.12);
    color: var(--green);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .badge-sell {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 4px;
    background: rgba(239, 68, 68, 0.12);
    color: var(--red);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .tx-link {
    color: var(--gold);
    text-decoration: none;
    font-size: 11px;
    padding: 4px 10px;
    border: 1px solid rgba(212, 168, 66, 0.3);
    border-radius: 4px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .tx-link:hover {
    background: rgba(212, 168, 66, 0.1);
    border-color: var(--gold);
  }

  /* States */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }

  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 15px; }

  .loading-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }

  .spinner {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 3px solid rgba(212, 168, 66, 0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--red);
    background: rgba(239, 68, 68, 0.05);
    border-radius: 12px;
  }

  .up { color: var(--green); }
  .down { color: var(--red); }
  .gold { color: var(--gold); }

  .footer {
    text-align: center;
    padding: 40px 0;
    border-top: 1px solid var(--border);
  }
  .footer p { color: var(--text-secondary); font-size: 12px; }

  @media (max-width: 768px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .search-row { flex-direction: column; }
    .search-btn { width: 100%; }
  }
</style>
</head>
<body>
<div class="container">

  <section class="hero">
    <div class="hero-badge">Wallet Tracker</div>
    <h1>NOX 持倉追蹤器</h1>
    <p class="hero-sub">查詢任意地址在 Arbitrum 上的 NOX 買賣紀錄</p>
  </section>

  <div class="search-section">
    <div class="search-row">
      <input class="search-input" id="wallet-input" type="text"
        placeholder="輸入錢包地址，例如 0xABCD...1234"
        oninput="this.value = this.value.trim()">
      <button class="search-btn" id="search-btn" onclick="search()">查詢</button>
    </div>
  </div>

  <div id="stats-section" style="display:none">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">買入次數</div>
        <div class="stat-value up" id="s-buy-count">—</div>
        <div class="stat-sub" id="s-buy-usdt">— USDT</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">賣出次數</div>
        <div class="stat-value down" id="s-sell-count">—</div>
        <div class="stat-sub" id="s-sell-usdt">— USDT</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">持有 NOX（估）</div>
        <div class="stat-value gold" id="s-net-nox">—</div>
        <div class="stat-sub" id="s-net-usdt">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">均買價</div>
        <div class="stat-value" id="s-avg-buy">—</div>
        <div class="stat-sub">USDT/NOX</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">均賣價</div>
        <div class="stat-value" id="s-avg-sell">—</div>
        <div class="stat-sub">USDT/NOX</div>
      </div>
    </div>
  </div>

  <div class="table-section">
    <div class="table-header">
      <h2>交易紀錄</h2>
      <span class="count-badge" id="tx-count" style="display:none"></span>
    </div>
    <div id="table-body">
      <div class="empty-state">
        <div class="icon">🔍</div>
        <p>輸入錢包地址查詢 NOX 交易紀錄</p>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>NOX Wallet Tracker &middot; 資料來源：Arbiscan API &middot; Arbitrum One</p>
  </footer>

</div>

<script>
  const NOX_CA  = '0xb23bb8c2c6cb9169eeac8f2bd42fcf333a1a8c55';
  const USDT_CA = '0xfd086bc7cd5c481dcc9c85ebe478a1c0b69fcbb9';
  const API     = 'https://api.arbiscan.io/api';

  function fmt(n, d = 0) {
    if (n == null) return '—';
    return d === 0
      ? Math.round(n).toLocaleString('en-US')
      : n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  }

  function fmtTime(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleString('zh-TW', {
      timeZone: 'Asia/Taipei',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    });
  }

  async function fetchTokenTxs(contract, address) {
    const url = `${API}?module=account&action=tokentx&contractaddress=${contract}&address=${address}&startblock=0&endblock=99999999&sort=desc&apikey=`;
    const r = await fetch(url);
    const j = await r.json();
    if (j.status !== '1') return [];
    return j.result;
  }

  async function search() {
    const wallet = document.getElementById('wallet-input').value.trim().toLowerCase();
    if (!wallet || !wallet.startsWith('0x') || wallet.length !== 42) {
      alert('請輸入有效的錢包地址（0x 開頭，42 位）');
      return;
    }

    const btn = document.getElementById('search-btn');
    btn.disabled = true;
    btn.textContent = '查詢中…';
    document.getElementById('stats-section').style.display = 'none';
    document.getElementById('tx-count').style.display = 'none';
    document.getElementById('table-body').innerHTML = `
      <div class="loading-state">
        <div><div class="spinner"></div></div>
        <p>正在從 Arbiscan 拉取資料…</p>
      </div>`;

    try {
      const [noxTxs, usdtTxs] = await Promise.all([
        fetchTokenTxs(NOX_CA, wallet),
        fetchTokenTxs(USDT_CA, wallet),
      ]);

      // Group USDT by txhash
      const usdtMap = {};
      for (const tx of usdtTxs) {
        if (!usdtMap[tx.hash]) usdtMap[tx.hash] = [];
        usdtMap[tx.hash].push(tx);
      }

      if (!noxTxs.length) {
        document.getElementById('table-body').innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <p>此地址沒有 NOX 交易紀錄</p>
          </div>`;
        btn.disabled = false;
        btn.textContent = '查詢';
        return;
      }

      // Build rows
      let totalBuyNox = 0, totalBuyUsdt = 0, buyCount = 0;
      let totalSellNox = 0, totalSellUsdt = 0, sellCount = 0;

      const rows = noxTxs.map(tx => {
        const isBuy = tx.to.toLowerCase() === wallet;
        const noxAmt = parseInt(tx.value) / 1e18;

        // Find USDT counterpart in same tx
        let usdtAmt = null;
        const usdtGroup = usdtMap[tx.hash] || [];
        for (const utx of usdtGroup) {
          const v = parseInt(utx.value) / 1e6;
          if (v > 0) { usdtAmt = v; break; }
        }

        const price = (usdtAmt && noxAmt) ? usdtAmt / noxAmt : null;

        if (isBuy) {
          buyCount++;
          totalBuyNox  += noxAmt;
          totalBuyUsdt += usdtAmt || 0;
        } else {
          sellCount++;
          totalSellNox  += noxAmt;
          totalSellUsdt += usdtAmt || 0;
        }

        return { hash: tx.hash, ts: tx.timeStamp, isBuy, noxAmt, usdtAmt, price };
      });

      // Stats
      const netNox = totalBuyNox - totalSellNox;
      const netUsdt = totalSellUsdt - totalBuyUsdt;
      const avgBuy  = buyCount  && totalBuyUsdt  ? totalBuyUsdt  / totalBuyNox  : null;
      const avgSell = sellCount && totalSellUsdt ? totalSellUsdt / totalSellNox : null;

      document.getElementById('s-buy-count').textContent  = buyCount;
      document.getElementById('s-buy-usdt').textContent   = fmt(totalBuyUsdt, 2) + ' USDT';
      document.getElementById('s-sell-count').textContent = sellCount;
      document.getElementById('s-sell-usdt').textContent  = fmt(totalSellUsdt, 2) + ' USDT';
      document.getElementById('s-net-nox').textContent    = fmt(netNox, 0) + ' NOX';
      document.getElementById('s-net-usdt').textContent   = (netUsdt >= 0 ? '+' : '') + fmt(netUsdt, 2) + ' USDT';
      document.getElementById('s-avg-buy').textContent    = avgBuy  ? fmt(avgBuy, 4)  : '—';
      document.getElementById('s-avg-sell').textContent   = avgSell ? fmt(avgSell, 4) : '—';
      document.getElementById('stats-section').style.display = 'block';

      // Table
      const countEl = document.getElementById('tx-count');
      countEl.textContent = rows.length + ' 筆';
      countEl.style.display = 'inline-block';

      const rowsHtml = rows.map(r => `
        <tr>
          <td style="color:var(--text-secondary);font-size:12px">${fmtTime(r.ts)}</td>
          <td><span class="${r.isBuy ? 'badge-buy' : 'badge-sell'}">${r.isBuy ? 'BUY' : 'SELL'}</span></td>
          <td style="color:${r.isBuy ? 'var(--green)' : 'var(--red)'};font-weight:700">
            ${r.isBuy ? '+' : '-'}${fmt(r.noxAmt, 2)} NOX
          </td>
          <td>${r.usdtAmt != null ? fmt(r.usdtAmt, 2) + ' USDT' : '<span style="color:var(--text-secondary)">—</span>'}</td>
          <td>${r.price != null ? fmt(r.price, 4) + ' U' : '<span style="color:var(--text-secondary)">—</span>'}</td>
          <td>
            <a class="tx-link" href="https://arbiscan.io/tx/${r.hash}" target="_blank" rel="noopener">
              ${r.hash.slice(0,8)}… ↗
            </a>
          </td>
        </tr>`).join('');

      document.getElementById('table-body').innerHTML = `
        <table class="tx-table">
          <thead>
            <tr>
              <th>時間 (UTC+8)</th>
              <th>類型</th>
              <th>NOX 數量</th>
              <th>USDT 金額</th>
              <th>單價</th>
              <th>查看</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>`;

    } catch (e) {
      document.getElementById('table-body').innerHTML = `
        <div class="error-state">
          <p>⚠️ 查詢失敗：${e.message}</p>
          <p style="font-size:13px;margin-top:8px;color:var(--text-secondary)">請稍後再試，或確認地址格式正確</p>
        </div>`;
    }

    btn.disabled = false;
    btn.textContent = '查詢';
  }

  // Enter key support
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('wallet-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') search();
    });
  });
</script>
</body>
</html>

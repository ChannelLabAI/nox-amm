<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOX 持倉追蹤器</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --gold: #D4A842; --gold-light: #F0D68A; --gold-dark: #A67C2E;
    --green: #22C55E; --green-glow: rgba(34,197,94,0.15);
    --red: #EF4444;
    --bg-dark: #0A0A0F; --bg-card: #12121A; --bg-input: #0E0E16;
    --text-primary: #EEEEF0; --text-secondary: #9999AA;
    --purple: #8B5CF6;
    --border: rgba(212,168,66,0.15); --border-focus: rgba(212,168,66,0.4);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family:'Noto Sans TC',-apple-system,sans-serif;
    background:var(--bg-dark); color:var(--text-primary);
    line-height:1.7; overflow-x:hidden; min-height:100vh;
  }

  body::before {
    content:''; position:fixed; top:0;left:0;right:0;bottom:0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%,rgba(139,92,246,0.08) 0%,transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 50%,rgba(212,168,66,0.05) 0%,transparent 50%);
    pointer-events:none; z-index:0;
  }

  .container { max-width:1100px; margin:0 auto; padding:0 24px; position:relative; z-index:1; }

  .hero { text-align:center; padding:56px 0 36px; }
  .hero-badge { display:inline-block; padding:5px 16px; border:1px solid var(--purple); border-radius:50px; font-size:12px; letter-spacing:2px; color:var(--purple); text-transform:uppercase; margin-bottom:18px; background:rgba(139,92,246,0.1); }
  .hero h1 { font-size:clamp(22px,4vw,36px); font-weight:900; line-height:1.2; margin-bottom:10px; background:linear-gradient(135deg,var(--gold-light) 0%,var(--gold) 50%,var(--gold-dark) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .hero-sub { font-size:13px; color:var(--text-secondary); }

  .search-section { background:var(--bg-card); border:1px solid var(--border); border-radius:20px; padding:28px; margin-bottom:28px; }
  .search-row { display:flex; gap:12px; align-items:center; }
  .search-input { flex:1; padding:14px 20px; background:var(--bg-input); border:1px solid var(--border); border-radius:12px; color:var(--text-primary); font-family:'JetBrains Mono',monospace; font-size:13px; outline:none; transition:border-color 0.2s; }
  .search-input:focus { border-color:var(--border-focus); }
  .search-input::placeholder { color:var(--text-secondary); }
  .search-btn { padding:14px 28px; background:linear-gradient(135deg,var(--gold-dark),var(--gold)); border:none; border-radius:12px; color:#0A0A0F; font-family:'Noto Sans TC',sans-serif; font-size:15px; font-weight:700; cursor:pointer; transition:opacity 0.2s; white-space:nowrap; }
  .search-btn:hover { opacity:0.9; } .search-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .refresh-btn { padding:14px 16px; border:1px solid var(--border); border-radius:12px; background:transparent; color:var(--text-secondary); font-size:16px; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
  .refresh-btn:hover { border-color:var(--gold); color:var(--gold); }

  .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px; }
  .stat-card { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:16px; text-align:center; }
  .stat-label { font-size:11px; color:var(--text-secondary); letter-spacing:1px; text-transform:uppercase; margin-bottom:5px; }
  .stat-value { font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; }
  .stat-sub { font-size:11px; color:var(--text-secondary); margin-top:3px; }

  .section-card { background:var(--bg-card); border:1px solid var(--border); border-radius:20px; padding:28px; margin-bottom:24px; overflow-x:auto; }
  .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:8px; }
  .section-header h2 { font-size:17px; font-weight:700; }
  .count-badge { padding:3px 12px; background:rgba(139,92,246,0.1); border:1px solid rgba(139,92,246,0.3); border-radius:50px; font-size:12px; color:var(--purple); font-family:'JetBrains Mono',monospace; }

  .tx-table { width:100%; border-collapse:collapse; min-width:680px; }
  .tx-table th { text-align:left; padding:9px 13px; font-size:11px; color:var(--text-secondary); letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid var(--border); }
  .tx-table td { padding:12px 13px; font-family:'JetBrains Mono',monospace; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.03); vertical-align:middle; }
  .tx-table tr:hover td { background:rgba(212,168,66,0.03); }
  .tx-table tr:last-child td { border-bottom:none; }

  .badge-buy    { display:inline-block; padding:3px 10px; border-radius:4px; background:rgba(34,197,94,0.12);   color:var(--green);  font-size:11px; font-weight:700; letter-spacing:1px; }
  .badge-sell   { display:inline-block; padding:3px 10px; border-radius:4px; background:rgba(239,68,68,0.12);   color:var(--red);    font-size:11px; font-weight:700; letter-spacing:1px; }
  .badge-stake  { display:inline-block; padding:3px 10px; border-radius:4px; background:rgba(139,92,246,0.12);  color:var(--purple); font-size:11px; font-weight:700; letter-spacing:1px; }
  .badge-unstake{ display:inline-block; padding:3px 10px; border-radius:4px; background:rgba(212,168,66,0.12);  color:var(--gold);   font-size:11px; font-weight:700; letter-spacing:1px; }
  .badge-reward { display:inline-block; padding:3px 10px; border-radius:4px; background:rgba(6,182,212,0.12);   color:#06B6D4;       font-size:11px; font-weight:700; letter-spacing:1px; }
  .badge-in     { display:inline-block; padding:3px 10px; border-radius:4px; background:rgba(34,197,94,0.08);   color:#86EFAC;       font-size:11px; font-weight:700; letter-spacing:1px; }
  .badge-out    { display:inline-block; padding:3px 10px; border-radius:4px; background:rgba(148,163,184,0.10); color:#94A3B8;       font-size:11px; font-weight:700; letter-spacing:1px; }

  .drill-btn { padding:3px 10px; border-radius:6px; border:1px solid rgba(212,168,66,0.3); background:transparent; color:var(--gold); font-size:11px; font-weight:600; cursor:pointer; transition:all 0.15s; white-space:nowrap; flex-shrink:0; }
  .drill-btn:hover { background:rgba(212,168,66,0.12); border-color:var(--gold); }

  .filter-bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .filter-btn { padding:5px 14px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--text-secondary); font-family:'Noto Sans TC',sans-serif; font-size:12px; font-weight:500; cursor:pointer; transition:all 0.15s; }
  .filter-btn:hover { border-color:rgba(212,168,66,0.4); color:var(--text-primary); }
  .filter-btn.active { background:rgba(212,168,66,0.12); border-color:var(--gold); color:var(--gold); font-weight:700; }

  .tx-link { color:var(--gold); text-decoration:none; font-size:11px; padding:3px 9px; border:1px solid rgba(212,168,66,0.3); border-radius:4px; transition:all 0.2s; white-space:nowrap; }
  .tx-link:hover { background:rgba(212,168,66,0.1); border-color:var(--gold); }

  .related-list { display:flex; flex-direction:column; gap:12px; }
  .related-card { background:var(--bg-input); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .related-card:hover { border-color:rgba(212,168,66,0.3); }
  .related-header { display:flex; align-items:center; gap:12px; padding:14px 18px; cursor:pointer; user-select:none; }
  .flow-badge { font-size:11px; padding:3px 10px; border-radius:4px; font-weight:700; letter-spacing:1px; white-space:nowrap; }
  .flow-in   { background:rgba(34,197,94,0.12);  color:var(--green); }
  .flow-out  { background:rgba(239,68,68,0.12);  color:var(--red);   }
  .flow-both { background:rgba(212,168,66,0.12); color:var(--gold);  }
  .related-addr { font-family:'JetBrains Mono',monospace; font-size:12px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .related-summary { font-size:12px; color:var(--text-secondary); white-space:nowrap; }
  .related-expand { font-size:11px; color:var(--text-secondary); margin-left:8px; }
  .related-body { display:none; padding:0 18px 14px; overflow-x:auto; }
  .related-body.open { display:block; }
  .related-body .tx-table { min-width:600px; }

  .empty-state,.loading-state { text-align:center; padding:50px 20px; color:var(--text-secondary); }
  .error-state { text-align:center; padding:40px 20px; color:var(--red); }
  .empty-state .icon { font-size:40px; margin-bottom:14px; }
  .spinner { display:inline-block; width:28px; height:28px; border:3px solid rgba(212,168,66,0.2); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:14px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .progress-msg { font-size:13px; color:var(--text-secondary); margin-bottom:14px; }

  .up { color:var(--green); } .down { color:var(--red); } .gold { color:var(--gold); }

  #graph-section { background:var(--bg-card); border:1px solid var(--border); border-radius:20px; padding:28px; margin-bottom:24px; }
  #wallet-graph { height:380px; border-radius:12px; overflow:hidden; background:var(--bg-dark); }

  .footer { text-align:center; padding:36px 0; border-top:1px solid var(--border); }
  .footer p { color:var(--text-secondary); font-size:12px; }

  @media (max-width:768px) {
    .stats-grid { grid-template-columns:repeat(2,1fr); }
    .search-row { flex-direction:column; }
    .search-btn { width:100%; }
    .tx-table { min-width:unset; }
    .tx-table th:nth-child(5), .tx-table td:nth-child(5),
    .tx-table th:nth-child(6), .tx-table td:nth-child(6) { display:none; }
    .related-body .tx-table th:nth-child(5), .related-body .tx-table td:nth-child(5),
    .related-body .tx-table th:nth-child(6), .related-body .tx-table td:nth-child(6) { display:none; }
  }

  /* ── Wallet Notes ── */
  .note-row { display:none; align-items:center; gap:10px; margin-top:14px; padding-top:14px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .note-label { font-size:12px; color:var(--text-secondary); white-space:nowrap; }
  .note-display { font-size:13px; color:var(--gold); font-weight:600; flex:1; min-width:0; }
  .note-empty { font-size:13px; color:var(--text-secondary); font-style:italic; flex:1; }
  .note-input { flex:1; min-width:160px; padding:7px 12px; background:var(--bg-input); border:1px solid var(--border-focus); border-radius:8px; color:var(--text-primary); font-size:13px; outline:none; }
  .note-btn { padding:6px 14px; border-radius:8px; border:1px solid rgba(212,168,66,0.4); background:transparent; color:var(--gold); font-size:12px; font-weight:600; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
  .note-btn:hover { background:rgba(212,168,66,0.12); }
  .note-btn.save { background:rgba(212,168,66,0.15); border-color:var(--gold); }
  .note-btn.cancel { border-color:var(--border); color:var(--text-secondary); }
  .note-btn.cancel:hover { background:rgba(255,255,255,0.05); }
  .note-chip { display:inline-flex; align-items:center; gap:4px; background:rgba(212,168,66,0.1); border:1px solid rgba(212,168,66,0.25); border-radius:12px; padding:2px 8px; font-size:11px; color:var(--gold); font-weight:600; font-family:'Noto Sans TC',sans-serif; white-space:nowrap; }
  .note-edit-inline { padding:2px 7px; border-radius:5px; border:1px solid rgba(212,168,66,0.3); background:transparent; color:var(--text-secondary); font-size:10px; cursor:pointer; transition:all 0.15s; margin-left:4px; }
  .note-edit-inline:hover { color:var(--gold); border-color:var(--gold); }

  /* ── Settings Modal ── */
  .settings-btn { background:none; border:1px solid rgba(139,92,246,0.4); border-radius:8px; color:var(--purple); font-size:14px; padding:5px 10px; cursor:pointer; transition:all 0.15s; margin-left:10px; vertical-align:middle; }
  .settings-btn:hover { background:rgba(139,92,246,0.12); border-color:var(--purple); }
  .modal-close-btn { position:absolute; top:16px; right:18px; background:none; border:none; font-size:20px; color:var(--text-secondary); cursor:pointer; line-height:1; }
  .modal-close-btn:hover { color:var(--text-primary); }
  .modal-box { position:relative; }
  .copy-btn { padding:2px 7px; border-radius:5px; border:1px solid rgba(212,168,66,0.3); background:transparent; color:var(--text-secondary); font-size:11px; cursor:pointer; transition:all 0.15s; flex-shrink:0; }
  .copy-btn:hover { color:var(--gold); border-color:var(--gold); }
  .mode-badge { display:inline-block; padding:3px 14px; background:rgba(34,197,94,0.12); border:1px solid rgba(34,197,94,0.3); border-radius:50px; font-size:11px; color:var(--green); font-weight:600; letter-spacing:1px; margin-top:10px; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:var(--bg-card); border:1px solid rgba(139,92,246,0.4); border-radius:20px; padding:28px; width:90%; max-width:420px; }
  .modal-title { font-size:17px; font-weight:700; margin-bottom:20px; }
  .modal-input { width:100%; padding:12px 16px; background:var(--bg-input); border:1px solid var(--border); border-radius:10px; color:var(--text-primary); font-family:'JetBrains Mono',monospace; font-size:13px; outline:none; transition:border-color 0.2s; }
  .modal-input:focus { border-color:var(--border-focus); }
  .modal-input::placeholder { color:var(--text-secondary); }
  .modal-actions { display:flex; gap:10px; margin-top:16px; }
  .modal-save-btn { flex:1; padding:11px; background:linear-gradient(135deg,var(--gold-dark),var(--gold)); border:none; border-radius:10px; color:#0A0A0F; font-family:'Noto Sans TC',sans-serif; font-size:14px; font-weight:700; cursor:pointer; }
  .modal-clear-btn { padding:11px 18px; background:transparent; border:1px solid var(--border); border-radius:10px; color:var(--text-secondary); font-family:'Noto Sans TC',sans-serif; font-size:14px; cursor:pointer; transition:all 0.15s; }
  .modal-clear-btn:hover { border-color:var(--red); color:var(--red); }
  .modal-status { margin-top:12px; font-size:12px; color:var(--text-secondary); text-align:center; min-height:18px; }
  .export-btn { padding:5px 14px; border-radius:8px; border:1px solid rgba(212,168,66,0.3); background:transparent; color:var(--gold); font-family:'Noto Sans TC',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:all 0.15s; }
  .export-btn:hover { background:rgba(212,168,66,0.12); border-color:var(--gold); }
</style>
</head>
<body>
<div class="container">

  <section class="hero">
    <div>
      <div class="hero-badge">Wallet Tracker</div>
      <button class="settings-btn" onclick="openSettings()" title="API 設定">⚙️</button>
    </div>
    <h1>NOX 持倉追蹤器</h1>
    <p class="hero-sub">查詢錢包 NOX 買賣紀錄，並自動追蹤關聯錢包</p>
    <div id="api-mode-badge" style="display:none" class="mode-badge">⚡ Arbiscan Mode</div>
  </section>

  <div class="search-section">
    <div class="search-row">
      <input class="search-input" id="wallet-input" type="text" placeholder="輸入錢包地址，例如 0xABCD...1234">
      <button class="search-btn" id="search-btn" onclick="search()">查詢</button>
      <button class="refresh-btn" id="refresh-btn" onclick="refreshSearch()" style="display:none" title="清除快取重新查詢">🔄</button>
    </div>
    <div class="note-row" id="main-note-row" data-addr="">
      <span class="note-label">備注</span>
      <span id="main-note-chip"></span>
      <input class="note-input" id="main-note-input" style="display:none" placeholder="輸入備注…" onkeydown="if(event.key==='Enter')saveMainNote();if(event.key==='Escape')cancelMainNote()">
      <button class="note-btn" id="main-note-edit-btn" onclick="startMainNoteEdit()">✏️ 備注</button>
      <button class="note-btn save" id="main-note-save-btn" style="display:none" onclick="saveMainNote()">儲存</button>
      <button class="note-btn cancel" id="main-note-cancel-btn" style="display:none" onclick="cancelMainNote()">取消</button>
    </div>
  </div>

  <div id="stats-section" style="display:none">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">買入次數</div><div class="stat-value up" id="s-buy-count">—</div><div class="stat-sub" id="s-buy-usdt">— USDT</div></div>
      <div class="stat-card"><div class="stat-label">賣出次數</div><div class="stat-value down" id="s-sell-count">—</div><div class="stat-sub" id="s-sell-usdt">— USDT</div></div>
      <div class="stat-card"><div class="stat-label">持有 NOX（估）</div><div class="stat-value gold" id="s-net-nox">—</div><div class="stat-sub" id="s-net-usdt">—</div></div>
      <div class="stat-card"><div class="stat-label">均買價</div><div class="stat-value" id="s-avg-buy">—</div><div class="stat-sub">USDT/NOX</div></div>
      <div class="stat-card"><div class="stat-label">均賣價</div><div class="stat-value" id="s-avg-sell">—</div><div class="stat-sub">USDT/NOX</div></div>
      <div class="stat-card"><div class="stat-label">淨質押量</div><div class="stat-value" style="color:var(--purple)" id="s-stake-nox">—</div><div class="stat-sub" id="s-stake-sub">質押-解質押 NOX</div></div>
    </div>
  </div>


  <div class="section-card">
    <div class="section-header">
      <h2 id="main-table-title">交易紀錄</h2>
      <span class="count-badge" id="tx-count" style="display:none"></span>
      <button class="export-btn" id="export-btn" onclick="exportCsv()" style="display:none">⬇ 匯出 CSV</button>
    </div>
    <div id="table-body">
      <div class="empty-state"><div class="icon">🔍</div><p>輸入錢包地址查詢 NOX 交易紀錄</p></div>
    </div>
  </div>

  <div class="section-card" id="related-card" style="display:none">
    <div class="section-header">
      <h2>關聯錢包</h2>
      <span class="count-badge" id="related-count"></span>
    </div>
    <div id="related-progress" class="progress-msg" style="display:none"></div>
    <div class="related-list" id="related-list"></div>
  </div>

  <div id="graph-section" style="display:none">
    <div class="section-header" style="margin-bottom:18px">
      <h2>關係圖</h2>
      <span style="font-size:12px;color:var(--text-secondary)">點擊節點可切換查詢</span>
    </div>
    <div id="wallet-graph"></div>
  </div>

  <footer class="footer">
    <p>NOX Wallet Tracker &middot; 資料來源：BlockScout &middot; Arbitrum One</p>
  </footer>

</div>

<script>
  const NOX_CA    = '0xb23bb8c2c6cb9169eeac8f2bd42fcf333a1a8c55';
  const USDT_CA   = '0xfd086bc7cd5c481dcc9c85ebe478a1c0b69fcbb9';
  const POOL_CA      = '0xd3211dcd145990f740f8607fb0364080d718e3e3';
  // StakeNox proxy + staking vault (NOX transfers land in vault, not proxy)
  const STAKING_ADDRS = new Set([
    '0x2963103b7d93f853115c7aa055cfacec0ed77328', // StakeNox TransparentUpgradeableProxy
    '0x944f113bb6ca6be35b97c1b3953a0a15781979f1', // staking vault (actual NOX destination)
  ]);
  const BS        = 'https://arbitrum.blockscout.com/api/v2';

  const KNOWN_CONTRACTS = new Set([
    '0x0000000000000000000000000000000000000000',
    '0xd3211dcd145990f740f8607fb0364080d718e3e3', // NOX/USDT pool
    '0x4c60051384bd2d3c01bfc845cf5f4b44bcbe9de5',
    '0x68b3465833fb72a70ecdf485e0e4c7bd8665fc45',
    '0xe592427a0aece92de3edee1f18e0157c05861564',
    '0x1b02da8cb0d097eb8d57a175b88c7d8b47997506',
    '0xdef1c0ded9bec7f1a1670819833240f027b25eff',
  ]);

  function fmt(n,d=0) {
    if(n==null) return '—';
    return d===0 ? Math.round(n).toLocaleString('en-US')
      : n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
  }

  function fmtTime(isoStr) {
    return new Date(isoStr).toLocaleString('zh-TW',{
      timeZone:'Asia/Taipei', year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
    });
  }

  function shortAddr(addr) { return addr ? addr.slice(0,6)+'…'+addr.slice(-4) : '—'; }
  function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }

  // ── Wallet Notes (localStorage) ──────────────────────────────────────
  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function classifyTx(row) {
    const from = row.fromAddr;
    const to   = row.toAddr;
    if(from===POOL_CA || to===POOL_CA) return row.isBuy ? '買' : '賣';
    if(STAKING_ADDRS.has(to))   return '質押';
    if(STAKING_ADDRS.has(from)) return row.noxAmt < 100 ? '質押收益' : '解質押';
    return row.isBuy ? '轉入' : '轉出';
  }

  function typeBadge(type) {
    const map = {'買':'badge-buy','賣':'badge-sell','質押':'badge-stake','解質押':'badge-unstake','質押收益':'badge-reward','轉入':'badge-in','轉出':'badge-out'};
    return `<span class="${map[type]||'badge-out'}">${type}</span>`;
  }

  function typeColor(type) {
    return type==='買'||type==='解質押'||type==='質押收益'||type==='轉入' ? 'var(--green)'
         : type==='賣'||type==='質押'||type==='轉出' ? 'var(--red)'
         : 'var(--text-primary)';
  }

  async function fetchTransfersArbiscan(address, tokenContract, apiKey, onProgress) {
    const allItems = [];
    let page = 1;
    while(page <= 10) {
      const url = `https://api.arbiscan.io/api?module=account&action=tokentx&address=${address}&contractaddress=${tokenContract}&startblock=0&endblock=99999999&page=${page}&offset=10000&sort=desc&apikey=${apiKey}`;
      const r = await fetch(url);
      if(!r.ok) break;
      const j = await r.json();
      if(j.status !== '1') break;
      const batch = (j.result||[]).map(item => ({
        transaction_hash: item.hash,
        timestamp: new Date(parseInt(item.timeStamp)*1000).toISOString(),
        from: { hash: item.from.toLowerCase() },
        to:   { hash: item.to.toLowerCase() },
        total: { value: item.value, decimals: item.tokenDecimal },
      }));
      allItems.push(...batch);
      if(onProgress) onProgress(allItems.length);
      if(batch.length < 10000) break;
      page++;
    }
    return allItems;
  }

  async function fetchTransfersBlockscout(address, tokenContract, onProgress) {
    const items = [];
    let url = `${BS}/addresses/${address}/token-transfers?token=${tokenContract}&type=ERC-20`;
    let page = 0;
    while(page < 100) {
      const r = await fetch(url);
      if(!r.ok) break;
      const j = await r.json();
      items.push(...(j.items||[]));
      if(onProgress) onProgress(items.length);
      if(!j.next_page_params) break;
      const params = new URLSearchParams(j.next_page_params).toString();
      url = `${BS}/addresses/${address}/token-transfers?token=${tokenContract}&type=ERC-20&${params}`;
      await sleep(80);
      page++;
    }
    return items;
  }

  async function fetchTokenTransfers(address, tokenContract, onProgress) {
    const key = getArbiscanKey();
    if(key) return fetchTransfersArbiscan(address, tokenContract, key, onProgress);
    return fetchTransfersBlockscout(address, tokenContract, onProgress);
  }

  // Fetch normal transactions to find related wallets
  async function fetchTransactions(address, maxPages=4) {
    const items = [];
    let url = `${BS}/addresses/${address}/transactions?filter=to%7Cfrom`;
    for(let p=0; p<maxPages; p++) {
      const r = await fetch(url);
      if(!r.ok) break;
      const j = await r.json();
      items.push(...(j.items||[]));
      if(!j.next_page_params) break;
      const params = new URLSearchParams(j.next_page_params).toString();
      url = `${BS}/addresses/${address}/transactions?filter=to%7Cfrom&${params}`;
      await sleep(80);
    }
    return items;
  }

  async function fetchNoxData(wallet, onProgress) {
    // Session cache — re-querying same wallet within tab is instant
    const cacheKey='nox_sess_'+wallet.toLowerCase();
    try { const c=sessionStorage.getItem(cacheKey); if(c){ const p=JSON.parse(c); if(Date.now()-p.ts<180000) return p.data; } } catch(e){}

    const w = wallet.toLowerCase();

    // Parallel fetch: NOX + USDT transfers together (eliminates N per-tx lookups)
    // onProgress passed to NOX fetch only (main signal); USDT fetch runs silently
    const [noxItems, usdtItems] = await Promise.all([
      fetchTokenTransfers(wallet, NOX_CA, onProgress),
      fetchTokenTransfers(wallet, USDT_CA),
    ]);

    // Build USDT index by tx hash for O(1) join — direction-aware
    const usdtByTx={};
    for(const item of usdtItems) {
      if(!item.transaction_hash) continue;
      const v=parseInt(item.total?.value||'0')/Math.pow(10,parseInt(item.total?.decimals||'6'));
      if(v<=0) continue;
      const h=item.transaction_hash;
      if(!usdtByTx[h]) usdtByTx[h]=[];
      usdtByTx[h].push({v, from:(item.from?.hash||'').toLowerCase(), to:(item.to?.hash||'').toLowerCase()});
    }

    // Build basic rows
    const rows = noxItems.filter(item=>item.transaction_hash).map(item => {
      const from = (item.from?.hash||'').toLowerCase();
      const to   = (item.to?.hash||'').toLowerCase();
      const isBuy = to===w;
      const noxAmt = parseInt(item.total?.value||'0') / Math.pow(10, parseInt(item.total?.decimals||'18'));
      const row = { hash: item.transaction_hash, ts: item.timestamp, fromAddr: from, toAddr: to, isBuy, noxAmt, usdtAmt: null, price: null, type: null };
      row.type = classifyTx(row);
      return row;
    });

    // Join USDT amounts — zero extra API calls
    for(const row of rows) {
      if(row.type==='質押'||row.type==='解質押'||row.type==='質押收益') continue;
      const candidates=usdtByTx[row.hash]||[];
      // Direction-aware: BUY→wallet paid USDT (from=wallet); SELL→wallet received USDT (to=wallet)
      const found=candidates.find(t=>row.isBuy?t.from===w:t.to===w)||candidates[0];
      if(found) { row.usdtAmt=found.v; row.price=row.noxAmt>0?found.v/row.noxAmt:null; }
    }

    // Reclassify 轉入/轉出 that turned out to have USDT → they're swaps from unknown pools
    for(const row of rows) {
      if((row.type==='轉入'||row.type==='轉出') && row.usdtAmt!=null) {
        row.type = row.isBuy ? '買' : '賣';
      }
    }

    // Stats — only count pool buy/sell trades + staking
    let totalBuyNox=0,totalBuyUsdt=0,buyCount=0;
    let totalSellNox=0,totalSellUsdt=0,sellCount=0;
    let totalStakeNox=0, totalUnstakeNox=0;
    let totalTransferInNox=0, totalTransferOutNox=0;
    for(const row of rows) {
      if(row.type==='買')    { buyCount++;  totalBuyNox+=row.noxAmt; totalBuyUsdt+=row.usdtAmt||0; }
      if(row.type==='賣')    { sellCount++; totalSellNox+=row.noxAmt;totalSellUsdt+=row.usdtAmt||0; }
      if(row.type==='質押')   totalStakeNox+=row.noxAmt;
      if(row.type==='解質押') totalUnstakeNox+=row.noxAmt;
      if(row.type==='轉入') totalTransferInNox+=row.noxAmt;
      if(row.type==='轉出') totalTransferOutNox+=row.noxAmt;
    }
    const netNox = (totalBuyNox + totalTransferInNox) - (totalSellNox + totalTransferOutNox);
    const netStakeNox = totalStakeNox - totalUnstakeNox;
    const stakeRate = totalBuyNox>0 && netStakeNox>0 ? netStakeNox/totalBuyNox : null;

    const result = {
      rows, buyCount, sellCount,
      totalBuyNox, totalBuyUsdt, totalSellNox, totalSellUsdt,
      totalStakeNox, totalUnstakeNox, netStakeNox, stakeRate,
      totalTransferInNox, totalTransferOutNox,
      avgBuy:  buyCount&&totalBuyUsdt   ? totalBuyUsdt/totalBuyNox   : null,
      avgSell: sellCount&&totalSellUsdt ? totalSellUsdt/totalSellNox : null,
      netNox,
      netUsdt: totalSellUsdt-totalBuyUsdt,
    };
    try { sessionStorage.setItem(cacheKey, JSON.stringify({data:result, ts:Date.now()})); } catch(e){}
    return result;
  }

  async function findRelatedWallets(mainWallet, noxRows=[]) {
    const txns = await fetchTransactions(mainWallet);
    const w = mainWallet.toLowerCase();
    const addrCount={}, addrFlow={};

    // Scan ETH-level transactions
    for(const tx of txns) {
      const from=(tx.from?.hash||'').toLowerCase();
      const to  =(tx.to?.hash||'').toLowerCase();
      const isOut = from===w;
      const other = isOut ? to : from;
      if(!other||other===w||KNOWN_CONTRACTS.has(other)) continue;
      const flow = isOut?'out':'in';
      addrCount[other]=(addrCount[other]||0)+1;
      if(!addrFlow[other]) addrFlow[other]=flow;
      else if(addrFlow[other]!==flow) addrFlow[other]='both';
    }

    // Also scan NOX token transfer counterparties (catches P2P token transfers
    // that don't appear in ETH-level tx because the contract is the tx.to)
    for(const row of noxRows) {
      if(row.type!=='轉入'&&row.type!=='轉出') continue;
      const other = row.type==='轉入' ? row.fromAddr : row.toAddr;
      if(!other||other===w||KNOWN_CONTRACTS.has(other)||STAKING_ADDRS.has(other)) continue;
      const flow = row.type==='轉入'?'in':'out';
      addrCount[other]=(addrCount[other]||0)+1;
      if(!addrFlow[other]) addrFlow[other]=flow;
      else if(addrFlow[other]!==flow) addrFlow[other]='both';
    }

    const candidates = Object.entries(addrCount)
      .filter(([,c])=>c<100)
      .sort((a,b)=>b[1]-a[1])
      .slice(0,12)
      .map(([addr])=>addr);

    // Filter out contracts — only keep EOA wallets
    const isEOA = await Promise.all(candidates.map(async addr => {
      try {
        const r = await fetch(`${BS}/addresses/${addr}`);
        if(!r.ok) return true; // keep if can't verify
        const j = await r.json();
        return !j.is_contract;
      } catch(e) { return true; }
    }));

    return candidates
      .filter((_,i)=>isEOA[i])
      .slice(0,8)
      .map(addr=>({addr, flow:addrFlow[addr]}));
  }

  let _visNetwork = null;

  function buildGraph(mainWallet, related) {
    const graphEl = document.getElementById('graph-section');
    if(!related.length){ graphEl.style.display='none'; return; }
    graphEl.style.display='block';

    const mainShort = shortAddr(mainWallet);
    const nodes = new vis.DataSet([
      { id: mainWallet, label: getNote(mainWallet)||mainShort, shape:'dot', size:28,
        color:{ background:'#D4A842', border:'#F0D68A', highlight:{background:'#F0D68A',border:'#D4A842'} },
        font:{ color:'#0A0A0F', size:13, bold:true } },
      ...related.map(r => {
        const bg = r.flow==='in'?'#22C55E': r.flow==='out'?'#EF4444':'#8B5CF6';
        const bd = r.flow==='in'?'#86EFAC': r.flow==='out'?'#FCA5A5':'#C4B5FD';
        return { id:r.addr, label:getNote(r.addr)||shortAddr(r.addr), shape:'dot', size:18,
          color:{background:bg, border:bd, highlight:{background:bd,border:bg}},
          font:{color:'#EEEEF0', size:12} };
      })
    ]);

    const edgesArr = [];
    for(const r of related) {
      const opts = { color:{color:'rgba(212,168,66,0.5)',highlight:'#D4A842'}, width:2, label:'NOX', font:{color:'#9999AA',size:10,align:'middle'}, smooth:{type:'curvedCW',roundness:0.2} };
      if(r.flow==='in'||r.flow==='both')  edgesArr.push({ from:r.addr, to:mainWallet, arrows:'to', ...opts });
      if(r.flow==='out'||r.flow==='both') edgesArr.push({ from:mainWallet, to:r.addr, arrows:'to', ...opts });
    }
    const edges = new vis.DataSet(edgesArr);

    const container = document.getElementById('wallet-graph');
    if(_visNetwork) { _visNetwork.destroy(); }
    _visNetwork = new vis.Network(container, {nodes, edges}, {
      physics:{ stabilization:{iterations:120}, barnesHut:{gravitationalConstant:-3000,springLength:160} },
      interaction:{ hover:true, tooltipDelay:200 },
      layout:{ improvedLayout:true },
      background:'#0A0A0F',
    });

    _visNetwork.on('click', params => {
      if(params.nodes.length>0 && params.nodes[0]!==mainWallet) drillInto(params.nodes[0]);
    });
  }

  async function search() {
    const wallet=document.getElementById('wallet-input').value.trim().toLowerCase();
    if(!wallet||!wallet.startsWith('0x')||wallet.length!==42){ alert('請輸入有效的錢包地址'); return; }
    history.replaceState(null,'',`?a=${wallet}`);

    const btn=document.getElementById('search-btn');
    btn.disabled=true; btn.textContent='查詢中…';
    document.getElementById('stats-section').style.display='none';
    document.getElementById('related-card').style.display='none';
    document.getElementById('graph-section').style.display='none';
    document.getElementById('main-note-row').style.display='none';
    document.getElementById('tx-count').style.display='none';
    document.getElementById('export-btn').style.display='none';
    document.getElementById('refresh-btn').style.display='none';
    document.getElementById('main-table-title').textContent='交易紀錄';
    const _tb = document.getElementById('table-body');
    _tb.innerHTML='<div class="loading-state"><div><div class="spinner"></div></div><p>正在查詢主錢包…</p></div>';
    const _onProgress = (n) => {
      _tb.innerHTML=`<div class="loading-state"><div><div class="spinner"></div></div><p>已載入 ${n} 筆，繼續…</p></div>`;
    };

    try {
      const d = await fetchNoxData(wallet, _onProgress);

      document.getElementById('main-table-title').textContent=`${shortAddr(wallet)} 交易紀錄`;
      showMainNoteRow(wallet);

      if(!d.rows.length) {
        document.getElementById('table-body').innerHTML='<div class="empty-state"><div class="icon">📭</div><p>此地址沒有 NOX 交易紀錄</p></div>';
      } else {
        const ce=document.getElementById('tx-count');
        ce.textContent=d.rows.length+' 筆'; ce.style.display='inline-block';
        document.getElementById('export-btn').style.display='';
        document.getElementById('refresh-btn').style.display='';
        document.getElementById('s-buy-count').textContent=d.buyCount;
        document.getElementById('s-buy-usdt').textContent=fmt(d.totalBuyUsdt,2)+' USDT';
        document.getElementById('s-sell-count').textContent=d.sellCount;
        document.getElementById('s-sell-usdt').textContent=fmt(d.totalSellUsdt,2)+' USDT';
        document.getElementById('s-net-nox').textContent=fmt(d.netNox,0)+' NOX';
        document.getElementById('s-net-usdt').textContent=(d.netUsdt>=0?'+':'')+fmt(d.netUsdt,2)+' USDT';
        document.getElementById('s-avg-buy').textContent=d.avgBuy?fmt(d.avgBuy,4):'—';
        document.getElementById('s-avg-sell').textContent=d.avgSell?fmt(d.avgSell,4):'—';
        document.getElementById('s-stake-nox').textContent=fmt(d.netStakeNox,0)+' NOX';
        document.getElementById('s-stake-sub').textContent=d.stakeRate!=null?'佔買入 '+fmt(d.stakeRate*100,1)+'%':'質押-解質押 NOX';
        document.getElementById('stats-section').style.display='block';
        window._txTotal=d.rows.length;
        document.getElementById('table-body').innerHTML=buildFilterBar(d.rows)+buildTxTable(d.rows,'main-tx-table');
      }

      // Related wallets
      document.getElementById('related-card').style.display='block';
      document.getElementById('related-list').innerHTML='';
      document.getElementById('related-count').textContent='掃描中…';
      const progressEl=document.getElementById('related-progress');
      progressEl.style.display='block';
      progressEl.textContent='正在掃描關聯錢包…';

      const related=await findRelatedWallets(wallet, d.rows);

      if(!related.length) {
        document.getElementById('related-count').textContent='無';
        progressEl.style.display='none';
        document.getElementById('related-list').innerHTML='<div class="empty-state" style="padding:30px"><p>未發現有轉帳往來的關聯錢包</p></div>';
        btn.disabled=false; btn.textContent='查詢'; return;
      }

      document.getElementById('related-count').textContent=related.length+' 個';
      const listEl=document.getElementById('related-list');

      // Create all cards first (loading state), then fetch in parallel
      for(let i=0;i<related.length;i++) {
        const {addr,flow}=related[i];
        const cid='rc'+i;
        const flowLbl=flow==='in'?'⬇ 匯入':flow==='out'?'⬆ 匯出':'↕ 雙向';
        const flowCls=flow==='in'?'flow-in':flow==='out'?'flow-out':'flow-both';
        const card=document.createElement('div');
        card.className='related-card'; card.id='card-'+cid;
        card.innerHTML=`
          <div class="related-header" onclick="toggleRelated('${cid}')">
            <span class="flow-badge ${flowCls}">${flowLbl}</span>
            <span class="related-addr">${addr}</span>
            <button class="copy-btn" id="copy-${cid}" onclick="event.stopPropagation();copyAddr('${addr}','copy-${cid}')" title="複製地址">⎘</button>
            <span class="note-inline-container" data-addr="${addr}">${noteInlineHtml(addr)}</span>
            <span class="related-summary" id="rsummary-${cid}">查詢中…</span>
            <button class="drill-btn" onclick="event.stopPropagation();drillInto('${addr}')" title="切換為主查錢包">🔍 查詢</button>
            <span class="related-expand" id="arrow-${cid}">▶</span>
          </div>
          <div class="related-body" id="rb-${cid}">
            <div class="loading-state" style="padding:20px"><div class="spinner"></div></div>
          </div>`;
        listEl.appendChild(card);
      }

      // Parallel fetch — total time = slowest wallet, not sum of all
      progressEl.textContent=`並行查詢 ${related.length} 個關聯錢包中…`;
      let completedCount=0;
      await Promise.allSettled(related.map(async ({addr},i) => {
        const cid='rc'+i;
        try {
          const rd=await fetchNoxData(addr);
          const parts=[];
          if(rd.buyCount)  parts.push(`買 ${rd.buyCount} 筆`);
          if(rd.sellCount) parts.push(`賣 ${rd.sellCount} 筆`);
          if(!rd.rows.length) parts.push('無 NOX 紀錄');
          document.getElementById('rsummary-'+cid).textContent=parts.join(' · ');
          document.getElementById('rb-'+cid).innerHTML=buildTxTable(rd.rows);
        } catch(e) {
          document.getElementById('rsummary-'+cid).textContent='查詢失敗';
          document.getElementById('rb-'+cid).innerHTML=`<div class="error-state" style="padding:16px"><p>⚠️ ${e.message}</p></div>`;
        }
        const done=++completedCount;
        document.getElementById('related-count').textContent=done<related.length?`已完成 ${done}/${related.length}`:`${related.length} 個`;
      }));

      progressEl.style.display='none';
      buildGraph(wallet, related);
    } catch(e) {
      document.getElementById('table-body').innerHTML=`<div class="error-state"><p>⚠️ 查詢失敗：${e.message}</p></div>`;
    }

    btn.disabled=false; btn.textContent='查詢';
  }

  // ── Settings Modal ──────────────────────────────────────────────────
  function currentModeText() {
    return getArbiscanKey() ? '⚡ Arbiscan 極速模式' : '🔗 Blockscout 標準模式';
  }

  function updateModeBadge() {
    const badge = document.getElementById('api-mode-badge');
    badge.style.display = getArbiscanKey() ? '' : 'none';
  }

  function openSettings() {
    document.getElementById('arbiscan-key-input').value = getArbiscanKey();
    document.getElementById('modal-status').textContent = currentModeText();
    document.getElementById('settings-modal').classList.add('open');
  }

  function closeSettings() {
    document.getElementById('settings-modal').classList.remove('open');
  }

  function saveSettings() {
    const key = document.getElementById('arbiscan-key-input').value.trim();
    saveArbiscanKey(key);
    document.getElementById('modal-status').textContent = currentModeText();
    updateModeBadge();
  }

  function clearSettings() {
    saveArbiscanKey('');
    document.getElementById('arbiscan-key-input').value = '';
    document.getElementById('modal-status').textContent = currentModeText();
    updateModeBadge();
  }

  function copyAddr(addr, btnId) {
    navigator.clipboard.writeText(addr).then(()=>{
      const btn=document.getElementById(btnId);
      if(!btn) return;
      btn.textContent='✓';
      setTimeout(()=>{ btn.textContent='⎘'; },1500);
    });
  }

  document.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('wallet-input').addEventListener('keydown',e=>{ if(e.key==='Enter') search(); });
    updateModeBadge();
    const a=new URLSearchParams(location.search).get('a');
    if(a&&a.startsWith('0x')&&a.length===42){
      document.getElementById('wallet-input').value=a;
      search();
    }
  });
</script>

<div class="modal-overlay" id="settings-modal" onclick="if(event.target===this)closeSettings()">
  <div class="modal-box">
    <button class="modal-close-btn" onclick="closeSettings()">×</button>
    <div class="modal-title">API 設定</div>
    <input class="modal-input" id="arbiscan-key-input" type="text" placeholder="Arbiscan API Key（可選，加速查詢）">
    <div class="modal-actions">
      <button class="modal-save-btn" onclick="saveSettings()">儲存</button>
      <button class="modal-clear-btn" onclick="clearSettings()">清除</button>
    </div>
    <div class="modal-status" id="modal-status"></div>
  </div>
</div>
</body>
</html>

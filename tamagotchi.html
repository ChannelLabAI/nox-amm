<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a1a1a"><title>NOX 喵喵喵</title><link rel="stylesheet" href="tamagotchi.css"><link rel="stylesheet" href="shop.css"></head>
<body><main class="game-shell"><header><p class="eyebrow">NOXCAT FARM</p><h1>NOX 喵喵喵</h1><p class="subtitle" id="welcome">每天陪牠一下，收成愛心。</p></header>
<section class="farm" aria-live="polite"><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><div class="status"><span id="stage">蛋</span><span id="mood">精神飽滿</span></div><div class="cat-frame"><img id="cat" width="192" height="192" src="assets/noxcat-normal.png" alt="NOX 喵喵喵"><div id="equipped-visual" aria-hidden="true"></div></div><div class="grass"></div></section>
<p id="message" class="message">一顆黑色小蛋正在等待你的照顧。</p><section id="warning" class="warning" hidden>⚠️ 牠好像不太舒服，今天陪牠互動一下吧！</section>
<section id="actions" class="actions" aria-label="照顧 NOX 喵喵喵"><button data-care="feed">🍣<span id="feed-label">餵食</span></button><button data-care="play">🧶<span>玩耍</span></button><button data-care="clean">🫧<span>清潔</span></button></section>
<section class="harvest-card"><div><span class="label">好感度愛心</span><strong>♥ <span id="hearts">0</span></strong><small id="equipment-bonus"></small></div><button id="harvest">收成今日愛心</button></section>
<section class="utility"><button id="share">分享我的寵物</button><button id="open-settings">設定名稱</button><button id="open-shop" type="button">NOX 商店</button></section>
<section id="hospital" class="hospital" hidden><h2>🏥 NOX 喵喵喵在醫院</h2><p>連續 3 天沒有互動。追蹤官方 X 後，自行確認即可復活。</p><a class="follow" href="https://x.com/NOX" target="_blank" rel="noopener noreferrer">追蹤 NOX 官方 X ↗</a><button id="confirm-follow">我已追蹤，讓牠復活</button></section>
<dialog id="name-dialog"><form method="dialog"><h2>幫牠取名字</h2><label>暱稱 <input id="pet-name" maxlength="24" required autocomplete="off"></label><div class="dialog-actions"><button value="cancel">取消</button><button id="save-name" value="default">儲存</button></div></form></dialog>
<footer>進度只存在這台裝置；換裝置會遇見一隻新的 NOX 喵喵喵。</footer><dialog id="shop-dialog">
  <section class="noxcat-shop" aria-labelledby="shop-title">
    <div class="shop-heading"><h2 id="shop-title">NOX 商店</h2><button data-close="shop-dialog" type="button">關閉</button></div>
    <p id="wallet-status">瀏覽道具不需要連接錢包；確認購買時才會連接 Arbitrum One。</p>
    <div id="shop-items"></div>
    <section id="owned-items" hidden><h3>我的道具</h3><div id="owned-list"></div></section>
  </section>
</dialog>
<dialog id="confirm-dialog">
  <section class="noxcat-shop" aria-labelledby="confirm-title">
    <h2 id="confirm-title">確認購買</h2><p id="confirm-copy"></p>
    <p class="recipient">收款地址：<code id="recipient-address"></code></p>
    <p>交易會由你的錢包簽名；本頁不會要求或儲存私鑰、助記詞。</p>
    <div class="shop-actions"><button data-close="confirm-dialog" type="button">取消</button><button id="confirm-purchase" type="button">確認並以 NOX 付款</button></div>
  </section>
</dialog>
</main><script src="core.js"></script><script src="tamagotchi.js"></script><script src="shop.js"></script></body></html>

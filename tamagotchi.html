<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a1a1a"><title>NOX 喵喵喵</title><link rel="stylesheet" href="tamagotchi.css"><link rel="stylesheet" href="shop.css"></head>
<body><main class="game-shell"><header><p class="eyebrow">NOXCAT FARM</p><h1>NOX 喵喵喵</h1><p class="subtitle" id="welcome">每天陪牠一下，收成愛心。</p></header>
<section class="device" aria-label="NOXCAT 電子雞"><div class="brand">NOXCAT</div><div class="bezel"><div class="screen"><section class="farm" aria-live="polite"><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><div class="status"><span id="mood">精神飽滿</span></div><div class="cat-frame"><img id="cat" width="144" height="144" src="assets/noxcat-normal.png" alt="NOX 喵喵喵"><div id="equipped-visual" aria-hidden="true"></div></div></section><p id="message" class="message">一顆黑色小蛋正在等待你的照顧。</p><section id="warning" class="warning" hidden>⚠️ 牠好像不太舒服，今天陪牠互動一下吧！</section><section id="menu" class="menu" aria-label="主選單"><div class="menu-row menu-row--top"><div class="menu-item" data-menu-item="feed"><img src="assets/menu-feed-16px.png" alt=""><span id="feed-label">餵食</span></div><div class="menu-item" data-menu-item="play"><img src="assets/menu-play-16px.png" alt="">玩耍</div><div class="menu-item" data-menu-item="clean"><img src="assets/menu-clean-16px.png" alt="">清潔</div><div class="menu-item" data-menu-item="harvest"><img src="assets/menu-heart-16px.png" alt="">收成</div></div><div class="menu-row menu-row--bottom"><div class="menu-item" data-menu-item="share"><img src="assets/menu-share-16px.png" alt="">分享</div><div class="menu-item" data-menu-item="name"><img src="assets/menu-name-16px.png" alt="">命名</div><div class="menu-item" data-menu-item="shop"><img src="assets/menu-shop-16px.png" alt="">商店</div></div></section><section class="harvest-card"><div><span class="label">好感度愛心</span><strong>♥ <span id="hearts">0</span></strong><small id="equipment-bonus"></small></div></section></div></div><section class="device-controls" aria-label="電子雞操作按鈕"><button id="menu-left" type="button" aria-label="上一個選單項目">◀</button><button id="menu-confirm" type="button" aria-label="確認目前選單項目">●</button><button id="menu-right" type="button" aria-label="下一個選單項目">▶</button></section></section>
<button id="harvest" type="button" hidden aria-hidden="true" tabindex="-1"></button><button id="share" type="button" hidden aria-hidden="true" tabindex="-1"></button><button id="open-settings" type="button" hidden aria-hidden="true" tabindex="-1"></button><button id="open-shop" type="button" hidden aria-hidden="true" tabindex="-1"></button><section id="hospital" class="hospital" hidden><h2>🏥 NOX 喵喵喵在醫院</h2><p>連續 3 天沒有互動。追蹤官方 X 後，自行確認即可復活。</p><a class="follow" href="https://x.com/NOX" target="_blank" rel="noopener noreferrer">追蹤 NOX 官方 X ↗</a><button id="confirm-follow">我已追蹤，讓牠復活</button></section>
<dialog id="name-dialog"><form method="dialog"><h2>幫牠取名字</h2><label>暱稱 <input id="pet-name" maxlength="24" required autocomplete="off"></label><div class="dialog-actions"><button value="cancel">取消</button><button id="save-name" value="default">儲存</button></div></form></dialog><footer>進度只存在這台裝置；換裝置會遇見一隻新的 NOX 喵喵喵。</footer><dialog id="shop-dialog"><section class="noxcat-shop" aria-labelledby="shop-title"><div class="shop-heading"><h2 id="shop-title">NOX 愛心商店</h2><button data-close="shop-dialog" type="button">關閉</button></div><p id="shop-status">使用照顧 NOX 喵喵喵獲得的愛心兌換道具。</p><div id="shop-items"></div><section id="owned-items" hidden><h3>我的道具</h3><div id="owned-list"></div></section></section></dialog><dialog id="confirm-dialog"><section class="noxcat-shop" aria-labelledby="confirm-title"><h2 id="confirm-title">確認兌換</h2><p id="confirm-copy"></p><p id="confirm-wallet-note">愛心會立即扣除；本流程不會連接錢包或發送鏈上交易。</p><div class="shop-actions"><button data-close="confirm-dialog" type="button">取消</button><button id="confirm-purchase" type="button">確認兌換</button></div></section></dialog></main><script src="core.js"></script><script src="tamagotchi.js"></script><script src="shop.js"></script></body></html>
